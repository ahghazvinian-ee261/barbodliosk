name: Build BarbodKiosk

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore -r win-x64

      - name: Publish self-contained single-file exe
        run: dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish_output

      - name: Upload exe as artifact
        uses: actions/upload-artifact@v4
        with:
          name: BarbodKiosk-exe
          path: publish_output/BarbodKiosk.exe
